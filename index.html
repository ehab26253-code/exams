<script>
(function(){
"use strict";

var app=document.getElementById('app'),db=null;
var $=function(s,r){return(r||document).querySelector(s)};

function esc(s){
return String(s==null?'':s).replace(/[&<>"']/g,function(c){
return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function norm(n){return n.replace(/\s+/g,' ').trim()}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)}
function fmt(t){return new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})}
function lt(t){var d=new Date(t-new Date().getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)}
function show(h){app.innerHTML=h}

async function init(){
show('<div class="msg">جاري التحميل...</div>');
try{
var C=window.FIREBASE_CONFIG;
if(C&&C.apiKey){firebase.initializeApp(C);db=firebase.firestore()}
}catch(e){db=null}
home();
}

function home(){
var h='<div class="big"><button id="bt">المدرس</button><button id="bs">الطالب</button></div>';
if(!db)h+='<div class="msg bad">قاعدة البيانات مش متوصلة.</div>';

/* المدرس */

async function teacherLogin(){
if(!db)return;
var first=false,snap;
try{
snap=await db.doc('config/teacher').get();
first=!snap.exists;
}catch(e){

}
var teacherPw=first?null:snap.data().pw;

show('<div class="card"><label>'+(first?'اعمل باسورد جديد للمدرس':'باسورد المدرس')+'</label><input type="password" id="pw"><div class="row"><button id="go">دخول</button><button class="g" id="b">رجوع</button></div><div id="er" class="bad"></div></div>');

$('#b').onclick=home;
$('#go').onclick=async function(){

}else if(v===teacherPw)dash();

var unsubE=null,exams=[];

function dash(){
show('<div class="row"><button id="nw">+ امتحان جديد</button><button class="g" id="out">خروج</button></div><div id="list"></div>');
$('#out').onclick=function(){if(unsubE)unsubE();home()};
$('#nw').onclick=function(){examForm()};
unsubE=db.collection('exams').onSnapshot(function(s){
exams=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return b.startAt-a.startAt});
if($('#list'))renderList();
});
}

function renderList(){
var n=Date.now();
$('#list').innerHTML=exams.length?exams.map(function(e){
var st=n<e.startAt?'لسه مبدأش':n>e.endAt?'انتهى نهائيًا':'شغال الآن';
return '<div class="card"><b>'+esc(e.title)+'</b> <span class="tag">'+st+'</span><div class="mu">البداية: '+fmt(e.startAt)+' · المدة: '+e.dur+' دقيقة · النهاية: '+fmt(e.endAt)+' · '+e.qs.length+' سؤال</div><div class="row" style="margin-top:8px"><button data-r="'+e.id+'">النتائج والأخطاء</button><button class="g" data-e="'+e.id+'">تعديل</button><button class="d" data-d="'+e.id+'">حذف</button></div></div>';
}).join(''):'<div class="msg">مفيش امتحانات لسه.</div>';

app.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){results(b.dataset.r)}});
app.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){examForm(b.dataset.e)}});
app.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('حذف الامتحان؟'))db.doc('exams/'+b.dataset.d).delete()}});
}

/* استيراد الصور وملفات PDF والكاميرا */

var qs=[],ocrBusy=false;

function importPanel(){
return `
<div class="import-box">
<b>📷 إضافة الأسئلة تلقائيًا</b>
<p class="mu small">ارفع صورة أو PDF أو صوّر ورقة الأسئلة بالكاميرا. سيتم التعرف على النص الإنجليزي وتحويله إلى أسئلة قابلة للتعديل.</p>

<div class="import-actions">
<button type="button" class="g" id="pickImages">🖼️ رفع صور</button>
<button type="button" class="g" id="pickPdf">📄 رفع PDF</button>
<button type="button" class="g" id="takePhoto">📸 فتح الكاميرا</button>
</div>

<input id="imageFiles" type="file" accept="image/*" multiple hidden>
<input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
<input id="cameraFile" type="file" accept="image/*" capture="environment" hidden>

<div id="ocrStatus" class="small mu" aria-live="polite"></div>
<div class="progress"><i id="ocrProgress"></i></div>

<div class="small mu">
يدعم قراءة الإنجليزية. يجب مراجعة الأسئلة والاختيارات وتحديد الإجابة الصحيحة يدويًا قبل الحفظ.
</div>
</div>`;
}

function wireImporter(){
$('#pickImages').onclick=function(){$('#imageFiles').click()};
$('#pickPdf').onclick=function(){$('#pdfFile').click()};
$('#takePhoto').onclick=function(){$('#cameraFile').click()};

$('#imageFiles').onchange=function(){
if(this.files.length)processFiles(Array.from(this.files));
this.value='';
};
$('#cameraFile').onchange=function(){
if(this.files.length)processFiles(Array.from(this.files));
this.value='';
};
$('#pdfFile').onchange=function(){
if(this.files.length)processFiles(Array.from(this.files));
this.value='';
};
}

function statusOCR(msg,pct){
var s=$('#ocrStatus'),p=$('#ocrProgress');
if(s)s.textContent=msg;
if(p)p.style.width=Math.max(0,Math.min(100,pct||0))+'%';
}

async function processFiles(files){
if(ocrBusy)return;
if(!window.Tesseract){
statusOCR('مكتبة OCR لم يتم تحميلها. تحقق من الإنترنت.',0);
return;
}

ocrBusy=true;
['#pickImages','#pickPdf','#takePhoto','#aq','#sv'].forEach(function(sel){
var b=$(sel);if(b)b.disabled=true;
});

var allText=[];
var worker=null;

try{
worker=await Tesseract.createWorker('eng',1,{
logger:function(m){
if(m.status==='recognizing text'){
statusOCR('جاري قراءة الصورة... '+Math.round((m.progress||0)*100)+'%',Math.round((m.progress||0)*100));
}
}
});

for(var f of files){

if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){

if(!window.pdfjsLib)throw new Error('مكتبة PDF غير متاحة.');

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;

for(var pageNo=1;pageNo<=pdf.numPages;pageNo++){

statusOCR('قراءة صفحة PDF '+pageNo+' من '+pdf.numPages,0);

var page=await pdf.getPage(pageNo);
var viewport=page.getViewport({scale:2});
var canvas=document.createElement('canvas');
var ctx=canvas.getContext('2d');

canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({canvasContext:ctx,viewport:viewport}).promise;

var result=await worker.recognize(canvas);
allText.push(result.data.text);

canvas.width=canvas.height=1;
}

}else if(f.type.indexOf('image/')===0){

statusOCR('قراءة الصورة: '+f.name,0);
var result=await worker.recognize(f);
allText.push(result.data.text);

}else{
statusOCR('ملف غير مدعوم: '+f.name,0);
}
}

await worker.terminate();
worker=null;

var text=allText.join('\n');
var parsed=parseQuestions(text);

if(!parsed.length){
statusOCR('لم يتم التعرف على أسئلة واختيارات بشكل واضح. راجع النص المستخرج أو جرّب صورة أوضح.',100);
showOCRText(text);
}else{

var added=0;
parsed.forEach(function(q){
if(q.q.trim()&&q.o.some(function(x){return x.trim()})){
qs.push(q);added++;
}
});

drawExamForm();
statusOCR('تم استخراج '+added+' سؤال. راجع الأسئلة وحدد الإجابات الصحيحة.',100);

if($('#ocrStatus'))$('#ocrStatus').className='small ok';
}

}catch(err){
console.error(err);
statusOCR('حدث خطأ: '+(err.message||'خطأ غير معروف')+'. تحقق من الإنترنت وحاول مرة أخرى.',0);
}finally{
if(worker)await worker.terminate();
ocrBusy=false;
['#pickImages','#pickPdf','#takePhoto','#aq','#sv'].forEach(function(sel){
var b=$(sel);if(b)b.disabled=false;
});
}
}

/* تحليل الأسئلة المستخرجة */

function parseQuestions(raw){

var lines=raw.replace(/\r/g,'\n').split('\n')
.map(function(x){return x.replace(/\s+/g,' ').trim()})
.filter(Boolean);

var blocks=[],current=null;

var qStart=/^(?:(?:Q(?:uestion)?\s*)?\d{1,3}\s*[\).:\-]|Q(?:uestion)?\s*\d{1,3}\b)/i;
var optionStart=/^(?:\(?[A-Da-d]\)?\s*[\).:\-]|[A-Da-d]\s*[\)\.]|[١٢٣٤]\s*[\).:\-])/;

lines.forEach(function(line){

if(qStart.test(line)){
if(current)blocks.push(current);
current={q:line.replace(qStart,'').trim(),opts:[]};

}else if(current&&optionStart.test(line)){
current.opts.push(line.replace(optionStart,'').trim());

}else if(current){
if(current.opts.length){
current.opts[current.opts.length-1]+=' '+line;
}else{
current.q+=' '+line;
}
}

});

if(current)blocks.push(current);

return blocks.filter(function(b){
return b.q&&b.opts.length>=2;
}).map(function(b){

var opts=b.opts.slice(0,4);
while(opts.length<4)opts.push('');

return {q:b.q,o:opts,a:0};

});
}

function showOCRText(text){
var box=$('#ocrStatus');
if(!box)return;

var d=document.createElement('div');
d.className='msg';
d.innerHTML='<b>النص المستخرج للمراجعة:</b><textarea rows="8"></textarea>';

d.querySelector('textarea').value=text;
box.parentNode.appendChild(d);
}

/* نموذج الامتحان */

var currentExam=null,currentId=null;

function examForm(id){
currentId=id||null;

var e=exams.filter(function(x){return x.id===id})[0]||{
title:'',
startAt:Date.now(),
dur:30,
endAt:Date.now()+36e5*24,
qs:[{q:'',o:['','','',''],a:0}]
};

currentExam=e;
qs=JSON.parse(JSON.stringify(e.qs||[]));

drawExamForm();

}

function drawExamForm(){

var e=currentExam;

show(
'<div class="card">'+
'<label>اسم الامتحان</label><input id="t" value="'+esc(e.title)+'">'+
'<div class="row">'+
'<div><label>ميعاد البداية</label><input type="datetime-local" id="s" value="'+lt(e.startAt)+'"></div>'+
'<div><label>مدة الامتحان (دقيقة)</label><input type="number" id="du" min="1" value="'+e.dur+'"></div>'+
'<div><label>ميعاد الانتهاء النهائي</label><input type="datetime-local" id="en" value="'+lt(e.endAt)+'"></div>'+
'</div></div>'+
importPanel()+
'<div id="qs"></div>'+
'<div class="row"><button class="g" id="aq">+ سؤال يدوي</button><button id="sv">حفظ الامتحان</button><button class="g" id="cn">إلغاء</button></div>'+
'<div id="er" class="bad"></div>'
);

$('#qs').innerHTML=qs.map(function(q,i){

return '<div class="card">'+
'<label>سؤال '+(i+1)+' <a href="#" data-x="'+i+'" class="bad">حذف</a></label>'+
'<textarea data-q="'+i+'" rows="2">'+esc(q.q)+'</textarea>'+
q.o.map(function(o,j){

return '<div class="row">'+
'<label style="flex:0 0 24px"><input type="radio" name="a'+i+'" data-a="'+i+'-'+j+'" style="width:auto" '+(q.a===j?'checked':'')+'></label>'+
'<input data-o="'+i+'-'+j+'" value="'+esc(o)+'" placeholder="Option '+(j+1)+'">'+
'</div>';

}).join('')+
'<div class="mu">اختار الدائرة جنب الإجابة الصحيحة</div></div>';

}).join('');

app.querySelectorAll('[data-x]').forEach(function(a){
a.onclick=function(ev){
ev.preventDefault();
syncExam();
qs.splice(+a.dataset.x,1);
drawExamForm();
};
});

$('#aq').onclick=function(){
syncExam();
qs.push({q:'',o:['','','',''],a:0});
drawExamForm();
};

$('#cn').onclick=dash;
$('#sv').onclick=saveExam;
wireImporter();

}

function syncExam(){

var e=currentExam;

e.title=$('#t').value;
e.dur=+$('#du').value;
e.startAt=new Date($('#s').value).getTime();
e.endAt=new Date($('#en').value).getTime();

app.querySelectorAll('[data-q]').forEach(function(t){
qs[+t.dataset.q].q=t.value;
});

app.querySelectorAll('[data-o]').forEach(function(t){
var p=t.dataset.o.split('-');
qs[+p[0]].o[+p[1]]=t.value;
});

app.querySelectorAll('[data-a]').forEach(function(t){
if(t.checked){
var p=t.dataset.a.split('-');
qs[+p[0]].a=+p[1];
}
});

}

async function saveExam(){

syncExam();

var e=currentExam;
var er=$('#er');

if(!e.title.trim()||!e.dur||isNaN(e.startAt)||isNaN(e.endAt)){
er.textContent='كمّل اسم الامتحان والمواعيد والمدة';
return;
}

if(e.endAt<=e.startAt){
er.textContent='ميعاد الانتهاء لازم يكون بعد البداية';
return;
}

if(!qs.length||qs.some(function(q){
return !q.q.trim()||q.o.some(function(o){return !o.trim()});
})){
er.textContent='كل الأسئلة واختياراتها الأربعة لازم تتملي';
return;
}

try{

await db.doc('exams/'+(currentId||uid())).set({
title:e.title.trim(),
startAt:e.startAt,
endAt:e.endAt,
dur:e.dur,
qs:qs
});

dash();

}catch(x){
er.textContent='تعذر حفظ الامتحان. راجع اتصال Firebase.';
}

}

/* النتائج */

var unsubS=null;

function results(id){

var e=exams.filter(function(x){return x.id===id})[0];
if(!e)return;

show('<button class="g" id="b">رجوع</button><h3>'+esc(e.title)+'</h3><div id="rs"></div>');

$('#b').onclick=function(){
if(unsubS)unsubS();
dash();
};

unsubS=db.collection('subs').where('examId','==',id).onSnapshot(function(s){

var rows=s.docs.map(function(d){return d.data()});

$('#rs').innerHTML=rows.length?rows.map(function(r){

var h='<div class="card"><b>'+esc(r.name)+'</b>';

if(r.status!=='done'){
return h+'<span class="tag">بيمتحن الآن</span></div>';
}

h+='<span class="tag">'+r.score+' / '+e.qs.length+'</span>';
if(r.auto)h+=' <span class="tag bad">تسليم تلقائي</span>';

h+=mistakes(e,r.ans||[]);
return h+'</div>';

}).join(''):'<div class="msg">لسه محدش دخل الامتحان.</div>';

});

}

function mistakes(e,ans){

var m=e.qs.map(function(q,i){

return ans[i]===q.a?null:
'<div class="msg"><b>'+(i+1)+'. '+esc(q.q)+'</b>'+
'<div class="bad">إجابته: '+(ans[i]>=0?esc(q.o[ans[i]]):'لم يجب')+'</div>'+
'<div class="ok">الصح: '+esc(q.o[q.a])+'</div></div>';

}).filter(Boolean);

return m.length?
'<details><summary>الأخطاء ('+m.length+')</summary>'+m.join('')+'</details>':
'<div class="ok">كل الإجابات صح 🎉</div>';

}

/* الطالب */

var unsubX=null;

function studentHome(){

if(!db)return;

show('<div class="card"><label>اكتب اسمك رباعي</label><input id="nm" placeholder="الاسم الأول والثاني والثالث والرابع"><div class="row"><button id="go">عرض الامتحانات</button><button class="g" id="b">رجوع</button></div><div id="er" class="bad"></div></div><div id="ex"></div>');

$('#b').onclick=function(){
if(unsubX)unsubX();
home();
};

$('#go').onclick=function(){

var n=norm($('#nm').value);

if(n.split(' ').length<4){
$('#er').textContent='لازم تكتب الاسم رباعي';
return;
}

$('#er').textContent='';
listExams(n);

};

}

function listExams(name){

if(unsubX)unsubX();

unsubX=db.collection('exams').onSnapshot(function(s){

var n=Date.now();

var act=s.docs.map(function(d){
return Object.assign({id:d.id},d.data());
}).filter(function(e){
return n>=e.startAt&&n<=e.endAt;
});

$('#ex').innerHTML=act.length?act.map(function(e){

return '<div class="card"><b>'+esc(e.title)+'</b><div class="mu">المدة: '+e.dur+' دقيقة · يقفل: '+fmt(e.endAt)+'</div><button data-s="'+e.id+'">بدء الامتحان</button></div>';

}).join(''):'<div class="msg">مفيش امتحانات شغالة دلوقتي.</div>';

app.querySelectorAll('[data-s]').forEach(function(b){
b.onclick=function(){
begin(act.filter(function(x){return x.id===b.dataset.s})[0],name);
};
});

});

}

async function begin(e,name){

if(unsubX)unsubX();

var key=e.id+'_'+hash(name);
var att=db.doc('attempts/'+key);

if(Date.now()>e.endAt){
alert('الامتحان انتهى');
return studentHome();
}

var s=await att.get();

if(s.exists){
show('<div class="msg bad">دخلت الامتحان ده قبل كده ومينفعش تدخله تاني.</div><button class="g" id="b">رجوع</button>');
$('#b').onclick=studentHome;
return;
}

await att.set({t:Date.now()});

var sref=db.doc('subs/'+key);

async function put(o){
o.examId=e.id;
await sref.set(o);
}

await put({name:name,status:'started',t:Date.now()});

var ans=e.qs.map(function(){return -1});
var done=false;
var end=Math.min(Date.now()+e.dur*6e4,e.endAt);
var tm=null;

show(
'<div id="timer"></div><h3>'+esc(e.title)+' — '+esc(name)+'</h3>'+
'<div class="msg">لو خرجت من الصفحة أو غيّرت التبويب هيتسلم الامتحان تلقائي ومش هتقدر تدخل تاني.</div>'+
e.qs.map(function(q,i){

return '<div class="card"><b>'+(i+1)+'. '+esc(q.q)+'</b>'+
q.o.map(function(o,j){

return '<label class="opt"><input type="radio" name="q'+i+'" data-i="'+i+'" data-j="'+j+'">'+esc(o)+'</label>';

}).join('')+'</div>';

}).join('')+
'<button id="fin">تسليم الامتحان</button>'
);

app.querySelectorAll('[data-i]').forEach(function(r){
r.onchange=function(){
ans[+r.dataset.i]=+r.dataset.j;
};
});

async function finish(auto){

if(done)return;
done=true;

clearInterval(tm);
document.removeEventListener('visibilitychange',vis);
window.removeEventListener('blur',leave);
window.removeEventListener('pagehide',leave);

var score=e.qs.filter(function(q,i){
return ans[i]===q.a;
}).length;

try{
await put({
name:name,
status:'done',
score:score,
ans:ans,
auto:!!auto,
t:Date.now()
});
}catch(x){}

show(
'<div class="card"><h3>'+esc(name)+'</h3>'+
'<h2 class="'+(score*2>=e.qs.length?'ok':'bad')+'">درجتك: '+score+' / '+e.qs.length+'</h2>'+
(auto?'<div class="bad">تم التسليم تلقائيًا</div>':'')+
mistakes(e,ans)+'</div>'+
'<button class="g" id="b">رجوع للرئيسية</button>'
);

$('#b').onclick=home;

}

function leave(){finish(true)}
function vis(){if(document.hidden)finish(true)}

document.addEventListener('visibilitychange',vis);
window.addEventListener('blur',leave);
window.addEventListener('pagehide',leave);

$('#fin').onclick=function(){
if(confirm('تسليم الامتحان؟'))finish(false);
};

function tick(){

var r=end-Date.now();

if(r<=0){
finish(true);
return;
}

var m=Math.floor(r/6e4);
var s=Math.floor(r/1e3)%60;
var t=$('#timer');

if(t)t.textContent='الوقت المتبقي: '+m+':'+(s<10?'0':'')+s;

}

tm=setInterval(tick,1000);
tick();

}

init();

})();
</script>
</body>
</html>
